name: API Quality Check

on:
  # Daily scheduled run at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Manual trigger
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit the number of APIs to check'
        required: false
        type: number
      dry-run:
        description: 'Run without actually checking APIs'
        required: false
        type: boolean
        default: false

jobs:
  api-quality-check:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./scripts
      
      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: |
            ./.cache/api_responses.json
          key: ${{ runner.os }}-api-responses-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-api-responses-
      
      - name: Run API quality check
        working-directory: ./scripts
        run: |
          args="--parallel 10 --timeout 10"
          if [ "${{ inputs.dry-run || false }}" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            args="$args --limit ${{ inputs.limit }}"
          fi
          python validate_and_report.py $args
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apis.json data/report.json data/anomalies.json README.md
          git diff --staged
          git commit -m "Update API quality report and README" || echo "No changes to commit"
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}